<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartQuizzer 🚀 - AI Powered Learning</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

    <style>
        :root { 
            --primary-gold: #FFB300; 
            --accent-orange: #FF8E53; 
            --warm-white: #FFFDF5; 
            --nav-bg: #ffffff;
            --text-color: #333;
            --card-bg: #ffffff;
            --border-color: #FFEBB7;
            --shadow: rgba(0,0,0,0.05);
        }

        /* 🌙 DARK MODE VARIABLES */
        [data-theme='dark'] {
            --warm-white: #121212;
            --nav-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --card-bg: #222222;
            --border-color: #333;
            --shadow: rgba(0,0,0,0.4);
        }

        body { 
            background: var(--warm-white); 
            font-family: 'Fredoka', sans-serif; 
            color: var(--text-color);
            transition: background 0.3s ease, color 0.3s ease;
            min-height: 100vh;
        }

        .nav-top { 
            background: var(--nav-bg); 
            padding: 15px 25px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: 0 4px 12px var(--shadow); 
            position: sticky; top: 0; z-index: 1000;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-color);
            font-weight: 700;
            margin-left: 20px;
        }

        .sunshine-btn { 
            background: linear-gradient(to right, var(--primary-gold), var(--accent-orange)); 
            color: white !important; 
            padding: 10px 25px; 
            border-radius: 20px; 
            font-weight: 700; 
            box-shadow: 0 4px 0 #E69B00;
            text-decoration: none;
        }

        .glass-card { 
            background: var(--card-bg); 
            border: 3px solid var(--border-color); 
            border-radius: 35px; 
            padding: 40px; 
            box-shadow: 0 10px 30px var(--shadow);
            margin-top: 50px;
        }

        /* Dark Mode Switch Styling */
        .mode-toggle-btn {
            background: var(--border-color);
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-gold);
            font-size: 1.4rem;
            transition: 0.3s;
            margin-left: 20px;
        }

        .mode-toggle-btn:hover { transform: scale(1.1) rotate(15deg); }
    </style>
</head>
<body>

    <nav class="nav-top">
        <a href="index.html" style="text-decoration: none; font-weight: 900; color: var(--primary-gold); font-size: 1.8rem;">
            SmartQuizzer 🚀
        </a>
        
        <div class="nav-links d-flex align-items-center">
            <a href="index.html">Home</a>
            <div class="ms-4 d-none d-md-block" style="background: #FFF4E6; padding: 5px 15px; border-radius: 20px; color: var(--accent-orange); font-weight: 800; border: 2px solid #FFEBB7;">
                🔥 <span class="streak-val">3</span>
            </div>
            <a href="login.html" class="ms-3">Login</a>
            <a href="signup.html" class="sunshine-btn ms-3">Sign Up</a>

            <button class="mode-toggle-btn" id="theme-toggle">
                <i class="fas fa-moon" id="theme-icon"></i>
            </button>
        </div>
    </nav>

    <div class="container animate__animated animate__fadeIn">
        <div class="row justify-content-center text-center">
            <div class="col-md-9">
                <div class="glass-card">
                    <h1 class="display-3 fw-bold mb-4" style="color: var(--primary-gold);">Unlock Your Brain Power! 🧠</h1>
                    <p class="fs-4 mb-5">AI-powered quizzes designed specifically for your growth. Track streaks, earn badges, and master any subject.</p>
                    <a href="signup.html" class="sunshine-btn py-3 px-5 fs-5">Start Your Journey</a>
                </div>
            </div>
        </div>
    </div>

    <footer class="text-center mt-5 text-muted small">
        <p>© 2026 SmartQuizzer AI | Helping you learn faster ☀️</p>
    </footer>

    <script>
        const themeToggle = document.querySelector('#theme-toggle');
        const themeIcon = document.querySelector('#theme-icon');
        const htmlElement = document.documentElement;

        // Check for saved theme
        const savedTheme = localStorage.getItem('theme') || 'light';
        htmlElement.setAttribute('data-theme', savedTheme);
        updateIcon(savedTheme);

        themeToggle.addEventListener('click', () => {
            let currentTheme = htmlElement.getAttribute('data-theme');
            let newTheme = currentTheme === 'light' ? 'dark' : 'light';
            
            htmlElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateIcon(newTheme);
        });

        function updateIcon(theme) {
            if (theme === 'dark') {
                themeIcon.classList.replace('fa-moon', 'fa-sun');
            } else {
                themeIcon.classList.replace('fa-sun', 'fa-moon');
            }
        }
    </script>
</body>
</html>
