<style>
    :root {
        --primary-gold: #FFB300;
        --nav-bg: rgba(255, 255, 255, 0.85);
        --text-main: #333;
    }

    /* Dark Mode Variables */
    [data-theme='dark'] {
        --nav-bg: rgba(15, 23, 42, 0.9);
        --text-main: #f8fafc;
        background-color: #0f172a;
    }

    [data-theme='dark'] .brand-text-mode { color: #cbd5e1 !important; }
    [data-theme='dark'] .nav-link { color: #cbd5e1 !important; }
    [data-theme='dark'] .btn-light { background: #1e293b; border-color: #334155 !important; color: white; }

    .glass-nav {
        background: var(--nav-bg);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(0,0,0,0.05);
        z-index: 1000;
        transition: background 0.3s ease;
    }

    .nav-link {
        transition: all 0.3s ease;
        font-size: 0.95rem;
        color: #475569;
    }

    .nav-link:hover {
        color: var(--primary-gold) !important;
        transform: translateY(-1px);
    }

    /* Theme Switch Styling */
    .mode-icon {
        cursor: pointer;
        padding: 8px;
        border-radius: 50%;
        background: #f1f5f9;
        width: 42px;
        height: 42px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        color: #475569;
    }

    [data-theme='dark'] .mode-icon {
        background: #334155;
        color: #FFD700;
    }

    .mode-icon:hover {
        transform: rotate(15deg) scale(1.1);
        box-shadow: 0 0 15px rgba(255, 179, 0, 0.2);
    }
</style>

<script>
    const toggleSwitch = document.querySelector('#checkbox');
    const currentTheme = localStorage.getItem('theme');
    const icon = document.querySelector('#mode-icon');

    if (currentTheme) {
        document.documentElement.setAttribute('data-theme', currentTheme);
        if (currentTheme === 'dark') {
            toggleSwitch.checked = true;
            icon.innerHTML = '<i class="fas fa-sun"></i>';
        }
    }

    toggleSwitch.addEventListener('change', (e) => {
        if (e.target.checked) {
            document.documentElement.setAttribute('data-theme', 'dark');
            localStorage.setItem('theme', 'dark');
            icon.innerHTML = '<i class="fas fa-sun"></i>';
        } else {
            document.documentElement.setAttribute('data-theme', 'light');
            localStorage.setItem('theme', 'light');
            icon.innerHTML = '<i class="fas fa-moon"></i>';
        }
    });
</script>
