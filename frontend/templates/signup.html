<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join SmartQuizzer AI | ✨</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

    <style>
        :root { 
            --primary-gold: #FFB300; 
            --brand-midnight: #1a2a6c; 
            --bg-soft: #f8fafc;
        }
        
        body { 
            font-family: 'Fredoka', sans-serif; 
            background-color: var(--bg-soft);
            height: 100vh;
            display: flex;
            align-items: center;
        }

        .glass-card {
            background: white;
            border-radius: 40px;
            border: 1px solid #f1f5f9;
            box-shadow: 0 25px 50px rgba(0,0,0,0.06);
            transition: 0.3s;
        }

        .form-control {
            border: 2px solid #f1f5f9;
            background: #fdfdfd;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: var(--primary-gold);
            box-shadow: 0 0 15px rgba(255, 179, 0, 0.1);
            background: white;
            outline: none;
        }

        .sunshine-btn {
            background: var(--primary-gold);
            color: var(--brand-midnight);
            border: none;
            border-radius: 20px;
            font-weight: 800;
            box-shadow: 0 6px 0 #D4A017;
            transition: all 0.1s;
            letter-spacing: 0.5px;
        }

        .sunshine-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #D4A017;
        }

        .sunshine-btn:hover {
            background: #FFC107;
            color: var(--brand-midnight);
        }

        a { text-decoration: none; transition: 0.2s; }
        a:hover { opacity: 0.8; }
    </style>
</head>
<body>

<div class="container">
    <div style="max-width: 450px; margin: 0 auto;" class="animate__animated animate__zoomIn">
        <div class="glass-card text-center p-5">
            <div class="mb-4">
                <span style="font-size: 3rem;">🌟</span>
                <h2 class="fw-bold mt-2" style="color: var(--brand-midnight);">Create Account</h2>
                <p class="text-muted fw-medium">Join 5,000+ students learning today</p>
            </div>

            <form action="dashboard.html" method="GET">
                <div class="text-start mb-3">
                    <label class="small fw-bold text-muted ms-2 mb-1">YOUR NAME</label>
                    <input type="text" name="username" class="form-control p-3 rounded-4" placeholder="e.g. Alex Smith" required>
                </div>

                <div class="text-start mb-3">
                    <label class="small fw-bold text-muted ms-2 mb-1">EMAIL ADDRESS</label>
                    <input type="email" name="email" class="form-control p-3 rounded-4" placeholder="alex@email.com" required>
                </div>

                <div class="text-start mb-4">
                    <label class="small fw-bold text-muted ms-2 mb-1">SECRET PASSWORD</label>
                    <input type="password" name="password" class="form-control p-3 rounded-4" placeholder="••••••••" required>
                </div>

                <button type="submit" class="sunshine-btn w-100 py-3 fs-5">
                    Get Started 🚀
                </button>
            </form>

            <p class="mt-4 text-muted">
                Already a member? 
                <a href="login.html" class="text-warning fw-bold">Login</a>
            </p>
        </div>
    </div>
</div>

</body>
</html>
