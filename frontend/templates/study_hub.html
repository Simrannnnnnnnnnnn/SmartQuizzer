<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Study Hub | SmartQuizzer 🧠</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

    <style>
        :root { --primary-gold: #FFB300; --brand-midnight: #1a2a6c; }
        body { font-family: 'Fredoka', sans-serif; background: #f8fafc; color: #334155; }
        
        .glass-card { 
            background: white; 
            border-radius: 35px; 
            border: 1px solid #f1f5f9;
            box-shadow: 0 20px 50px rgba(0,0,0,0.05);
        }
        
        .border-top-gold { border-top: 8px solid var(--primary-gold) !important; }

        /* Tabs Styling */
        .nav-pills .nav-link { 
            color: #64748b; 
            background: #f1f5f9; 
            margin: 0 5px;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 2px solid transparent;
        }
        .nav-pills .nav-link.active { 
            background: var(--primary-gold) !important; 
            color: var(--brand-midnight) !important; 
            border-color: #D4A017 !important;
        }

        .custom-input { 
            border: 2px solid #e2e8f0; 
            padding: 15px 25px;
            font-size: 1.1rem;
        }
        .custom-input:focus { 
            border-color: var(--primary-gold); 
            box-shadow: 0 0 15px rgba(255,179,0,0.15); 
            outline: none;
        }

        .upload-box { 
            border: 3px dashed #cbd5e1; 
            background: #f8fafc; 
            cursor: pointer;
            transition: 0.3s;
        }
        .upload-box:hover { border-color: var(--primary-gold); background: #fffdf5; }

        .sunshine-btn { 
            background: var(--primary-gold); 
            color: var(--brand-midnight);
            border: none; 
            box-shadow: 0 6px 0 #D4A017;
            transition: 0.2s;
            font-size: 1.2rem;
        }
        .sunshine-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #D4A017; }
        
        #loadingOverlay {
            display: none;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>

<div class="container py-5 animate__animated animate__fadeIn">
    <div class="text-center mb-5">
        <h1 class="fw-bold display-5" style="color: var(--brand-midnight);">🚀 AI Study Hub</h1>
        <p class="text-muted fs-5">Turn any topic or document into high-impact study material.</p>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="glass-card p-4 p-md-5 border-top-gold">
                <form id="studyForm">
                    <ul class="nav nav-pills nav-justified mb-5" id="inputTabs">
                        <li class="nav-item">
                            <button class="nav-link active rounded-pill fw-bold" id="topic-tab" data-bs-toggle="pill" data-bs-target="#topicInput" type="button">🔍 Topic</button>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link rounded-pill fw-bold" id="text-tab" data-bs-toggle="pill" data-bs-target="#textInput" type="button">📝 Text</button>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link rounded-pill fw-bold" id="pdf-tab" data-bs-toggle="pill" data-bs-target="#pdfInput" type="button">📄 PDF</button>
                        </li>
                    </ul>

                    <div class="tab-content mt-4">
                        <div class="tab-pane fade show active" id="topicInput">
                            <label class="fw-bold mb-3 text-dark">What do you want to master today?</label>
                            <input type="text" name="topic_name" class="form-control rounded-pill custom-input" placeholder="e.g. Photosynthesis, TCP/IP, Stock Market basics...">
                        </div>

                        <div class="tab-pane fade" id="textInput">
                            <label class="fw-bold mb-3 text-dark">Paste your messy notes below:</label>
                            <textarea name="raw_text" class="form-control rounded-4 custom-input" rows="6" placeholder="Paste text here and AI will simplify it into Mnemonics..."></textarea>
                        </div>

                        <div class="tab-pane fade" id="pdfInput">
                            <div class="upload-box rounded-4 p-5 text-center" onclick="document.getElementById('pdf-file').click()">
                                <i class="fa-solid fa-cloud-arrow-up display-4 text-warning mb-3"></i>
                                <h5 class="fw-bold">Click to Upload PDF</h5>
                                <p class="text-muted small">Max size: 10MB</p>
                                <input type="file" id="pdf-file" name="pdf_file" class="d-none" accept=".pdf">
                                <div id="file-name-preview" class="mt-2 fw-bold text-success small"></div>
                            </div>
                        </div>
                    </div>

                    <div class="text-center mt-5">
                        <button type="submit" class="sunshine-btn w-100 py-3 rounded-pill fw-bold" id="generateBtn">
                            Generate Study Materials ✨
                        </button>
                        <div class="d-flex justify-content-center gap-3 mt-4">
                            <span class="badge bg-light text-muted border px-3 py-2 rounded-pill small">💡 Mnemonics</span>
                            <span class="badge bg-light text-muted border px-3 py-2 rounded-pill small">🗂️ Flashcards</span>
                            <span class="badge bg-light text-muted border px-3 py-2 rounded-pill small">📝 Summary</span>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<div id="loadingOverlay" class="position-fixed top-0 start-0 w-100 h-100 d-flex flex-column align-items-center justify-content-center" style="z-index: 9999;">
    <div class="spinner-grow text-warning" role="status" style="width: 4rem; height: 4rem;"></div>
    <h4 class="mt-4 fw-bold text-dark animate__animated animate__pulse animate__infinite text-center px-3">
        Llama-3 is analyzing your content... 🧠<br>
        <span class="fs-6 fw-normal text-muted">Building your custom study bundle</span>
    </h4>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // File upload preview logic
    document.getElementById('pdf-file').onchange = function() {
        if(this.files[0]) {
            document.getElementById('file-name-preview').innerHTML = 
                `<i class="fa-solid fa-file-pdf"></i> Ready to process: ${this.files[0].name}`;
        }
    };

    // Form Submit & Loading Logic
    document.getElementById('studyForm').onsubmit = (e) => {
        e.preventDefault();
        
        // Show Overlay
        document.getElementById('loadingOverlay').style.display = 'flex';
        
        // Disable button to prevent double-click
        const btn = document.getElementById('generateBtn');
        btn.disabled = true;
        btn.innerText = "Processing...";

        // Static Demo Delay
        setTimeout(() => {
            alert("Study Material Generated Successfully! (Preview Mode)");
            window.location.href = "review.html"; // Sending to review for now
        }, 3000);
    };
</script>

</body>
</html>
