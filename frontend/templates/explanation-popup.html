<div id="modal-overlay" onclick="closeExplanation()" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(8px); z-index: 1999; transition: 0.3s;"></div>

<div id="explanation-drawer" class="animate__animated" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90%; max-width: 450px; background: white; border-radius: 35px; padding: 35px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); z-index: 2000; border: 1px solid #f1f1f1;">
    
    <div class="text-center mb-4">
        <div style="background: #fff9db; width: 70px; height: 70px; border-radius: 20px; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px;">
            <span style="font-size: 2rem;">💡</span>
        </div>
        <h4 style="color: #1e293b; font-weight: 800; letter-spacing: -0.5px;">Deep Dive Insight</h4>
        <div style="width: 40px; height: 4px; background: #ffcc00; margin: 10px auto; border-radius: 10px;"></div>
    </div>

    <div class="explanation-body" style="margin-bottom: 30px;">
        <p id="explanation-content" style="line-height: 1.7; color: #475569; font-size: 1.05rem; text-align: center;">
            The Theory of Relativity explains how time and space are linked...
        </p>
    </div>

    <button onclick="closeExplanation()" style="width: 100%; background: #1e293b; color: white; border: none; padding: 16px; border-radius: 18px; font-weight: 700; font-size: 1rem; transition: 0.2s; cursor: pointer;" onmouseover="this.style.transform='scale(1.02)'" onmouseout="this.style.transform='scale(1)'">
        Got it, thanks! 🚀
    </button>
</div>

<script>
    function showExplanation(text) {
        const drawer = document.getElementById('explanation-drawer');
        const overlay = document.getElementById('modal-overlay');
        
        document.getElementById('explanation-content').innerText = text;
        
        overlay.style.display = 'block';
        drawer.style.display = 'block';
        drawer.classList.remove('animate__fadeOutDown');
        drawer.classList.add('animate__zoomIn');
    }

    function closeExplanation() {
        const drawer = document.getElementById('explanation-drawer');
        const overlay = document.getElementById('modal-overlay');
        
        drawer.classList.remove('animate__zoomIn');
        drawer.classList.add('animate__fadeOutDown');
        
        setTimeout(() => {
            drawer.style.display = 'none';
            overlay.style.display = 'none';
        }, 400);
    }
</script>
