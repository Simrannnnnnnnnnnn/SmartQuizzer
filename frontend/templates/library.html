<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library | SmartQuizzer AI 📚</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

    <style>
        :root { --primary-gold: #FFB300; }
        body { font-family: 'Fredoka', sans-serif; background-color: #fffdf5; }

        .sunshine-btn { 
            background: linear-gradient(135deg, #FFD700, #FFB300); 
            color: white; border: none; padding: 10px 25px; 
            border-radius: 50px; font-weight: bold; cursor: pointer; 
            text-decoration: none; transition: 0.3s;
        }
        .sunshine-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255, 179, 0, 0.3); color: white; }

        .glass-card { 
            background: white; border-radius: 25px; 
            box-shadow: 0 8px 32px rgba(0,0,0,0.05); 
            border: 1px solid #f1f5f9;
            transition: 0.3s;
        }
        .glass-card:hover { transform: translateY(-5px); border-color: var(--primary-gold); }

        .border-top-gold { border-top: 6px solid var(--primary-gold) !important; }
        .hidden-card { display: none !important; }

        /* Search Bar Styling */
        .search-input {
            border: 2px solid #FFEBB7 !important;
            transition: 0.3s;
        }
        .search-input:focus {
            border-color: var(--primary-gold) !important;
            box-shadow: 0 0 15px rgba(255, 179, 0, 0.1) !important;
        }

        /* Modal Customization */
        .modal-content { border-radius: 30px !important; border: none; }
        .insight-box { background: #FFFDF5; border-left: 6px solid var(--primary-gold); padding: 20px; border-radius: 15px; }
    </style>
</head>
<body>

<div class="container mt-5 animate__animated animate__fadeIn">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-5 gap-3">
        <div>
            <h1 class="fw-bold" style="color: var(--primary-gold);">Your Learning Library 📚</h1>
            <p class="text-muted">A complete archive of your AI-generated wisdom.</p>
        </div>
        <div class="d-flex gap-2">
            <a href="dashboard.html" class="btn btn-outline-danger rounded-pill px-4 fw-bold shadow-sm">
                <i class="fa-solid fa-fire me-2"></i>Mistakes
            </a>
            <a href="dashboard.html" class="sunshine-btn px-4 shadow-sm">
                <i class="fa-solid fa-plus me-2"></i>New Session
            </a>
        </div>
    </div>

    <div class="mb-5">
        <div class="position-relative">
            <input type="text" id="librarySearch" class="form-control rounded-pill px-5 py-3 search-input shadow-sm" 
                   placeholder="Search topics or questions (e.g. 'Photosynthesis')...">
            <i class="fa-solid fa-magnifying-glass position-absolute" style="left: 20px; top: 50%; transform: translateY(-50%); color: var(--primary-gold);"></i>
        </div>
    </div>

    <div class="row" id="questionGrid">
        </div>
</div>

<div class="modal fade" id="dynamicInsightModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content shadow-lg">
            <div class="modal-header border-0 px-4 pt-4">
                <h5 class="modal-title fw-bold" style="color: var(--primary-gold);">Question Insight</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body px-4 pb-4">
                <h4 id="modalQuestionText" class="fw-bold mb-4" style="line-height: 1.4; color: #2d3436;"></h4>
                <div class="insight-box">
                    <h6 class="fw-bold mb-2 text-warning"><i class="fas fa-robot me-2"></i>AI Breakdown</h6>
                    <div id="modalExplanationText" style="color: #4b4b4b; line-height: 1.6;"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // --- MOCK DATA FOR STATIC PREVIEW ---
    const mockQuestions = [
        { id: 101, topic: "Biology", text: "What is the primary function of Mitochondria in a cell?", explanation: "Mitochondria are known as the powerhouse of the cell because they generate most of the cell's supply of ATP." },
        { id: 102, topic: "Physics", text: "State Newton's Third Law of Motion with an example.", explanation: "For every action, there is an equal and opposite reaction. Example: A rocket launching upward." },
        { id: 103, topic: "Python", text: "What is the difference between a List and a Tuple?", explanation: "Lists are mutable (can change), while Tuples are immutable (cannot change)." },
        { id: 104, topic: "History", text: "Who was the first emperor of the Maurya Empire?", explanation: "Chandragupta Maurya founded the Maurya Empire in 322 BCE." }
    ];

    function renderLibrary() {
        const grid = document.getElementById('questionGrid');
        grid.innerHTML = mockQuestions.map(q => `
            <div class="col-md-6 col-lg-4 mb-4 question-card">
                <div class="glass-card h-100 d-flex flex-column border-top-gold p-4">
                    <div class="mb-3 d-flex justify-content-between align-items-center">
                        <span class="badge bg-light text-muted border rounded-pill">${q.topic}</span>
                        <span class="text-warning"><i class="fa-solid fa-star"></i></span>
                    </div>
                    <h6 class="fw-bold text-dark mb-4" style="min-height: 3rem;">${q.text}</h6>
                    <div class="mt-auto">
                        <button class="sunshine-btn w-100 rounded-pill py-2" 
                                onclick="openInsight('${q.text.replace(/'/g, "\\'")}', '${q.explanation.replace(/'/g, "\\")}')">
                            View Solution 💡
                        </button>
                    </div>
                </div>
            </div>
        `).join('');
    }

    function openInsight(question, explanation) {
        document.getElementById('modalQuestionText').innerText = question;
        document.getElementById('modalExplanationText').innerText = explanation;
        new bootstrap.Modal(document.getElementById('dynamicInsightModal')).show();
    }

    // Search logic
    document.getElementById('librarySearch').addEventListener('input', function() {
        const term = this.value.toLowerCase();
        document.querySelectorAll('.question-card').forEach(card => {
            const text = card.innerText.toLowerCase();
            card.classList.toggle('hidden-card', !text.includes(term));
        });
    });

    document.addEventListener('DOMContentLoaded', renderLibrary);
</script>
</body>
</html>
